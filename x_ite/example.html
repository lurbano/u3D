
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>X_ITE 3D Cube</title>

    <!-- Load X_ITE -->
    <script defer src="./x_ite-16.8.1/x_ite.min.js"></script>

    <style>
        body {
            margin: 0;
            background: #222;
            font-family: Arial, sans-serif;
        }

        x3d-canvas {
            width: 100vw;
            height: 100vh;
            display: block;
        }
    </style>
</head>
<body>

    <div id="Zona_del_3d">
        <x3d-canvas id="browser"></x3d-canvas>
    </div>

<script>


    class uXite{
        constructor(browser, scene){

            this.browser = browser;
            this.scene = scene;
    
            this.boxes = [];
            this.spheres = [];
            this.cylinders = [];
            this.cones = [];

            this.viewpoint = scene.createNode("Viewpoint");
            this.viewpoint.position = new X3D.SFVec3f(0, 0, 10);
            this.viewpoint.set_bind = true;

            scene.rootNodes.push(this.viewpoint);

        }

        addBox(){
            const box = new uBox(this.scene);
            this.boxes.push(box);
            return box;
        }
        addSphere(){
            const sphere = new uSphere(this.scene);
            this.spheres.push(sphere);
            return sphere;
        }
        addCylinder(){
            const cylinder = new uCylinder(this.scene);
            this.cylinders.push(cylinder);
            return cylinder;
        }
        addCone(){
            const cone = new uCone(this.scene);
            this.cones.push(cone);
            return cone;
        }
    }


    class uPrimitive{
        constructor(scene, primitiveType="Box"){
            const uVec = X3D.SFVec3f; //shortcut
            const uRot = X3D.SFRotation;
            const uColor = X3D.SFColor;
            
            this.scene = scene;
            this.transform  = this.scene .createNode ("Transform");
            this.shape      = scene .createNode ("Shape");
            this.appearance = scene .createNode ("Appearance");
            this.material   = scene .createNode ("Material");
            this.primitive  = scene .createNode (primitiveType);
 
            this.material  .diffuseColor    = new uColor(1,0,0);
            this.primitive .size            = new uVec(1,1,1);
            
            this.appearance .material       = this.material;
            this.shape      .appearance     = this.appearance;
            this.shape      .geometry       = this.primitive;

            this.transform.children.push(this.shape);
            this.scene.rootNodes.push(this.transform);
        }

        addTouchSensor(callback = null) {

            this.touchSensor = this.scene.createNode("TouchSensor");

            // Attach sensor to the Transform
            this.transform.children.push(this.touchSensor);

            // Listen for interaction
            this.touchSensor.addFieldCallback(
                "on",
                "isActive",
                (active) => {
                    if (active && callback) {
                        callback(this);
                    }
                }
            );

            return this;
        }

        pos(v = new X3D.SFVec3f(0, 0, 0)) {
            this.transform.translation = v;
            return this;
        }

        rotate(r = new X3D.SFRotation(0, 1, 0, Math.PI / 4)) {
            this.transform.rotation = r;
            return this;
        }

        size(v = new X3D.SFVec3f(1, 1, 1)) {
            this.transform.scale = v;
            return this;
        }

        color(c = new X3D.SFColor(1, 1, 1)) {
            // console.log("color:",c);
            this.material.diffuseColor = c;
            return this;
        }

        addLink(url, target = "_blank") {

            this.addTouchSensor(() => {
                window.open(url, target);
            });

            return this;
        }

        image(imgURL = new X3D.MFString("./images/FullMoon2010.jpeg")){
            this.texture = this.scene.createNode("ImageTexture");
            this.texture.url = imgURL;
            this.appearance.texture = this.texture;
            return this;
        }

        audioLoad(audioURL = "./audio/under-water-splash-3.mp3", volume=1, loop=false){
            this.audio = new Audio(audioURL); //using browser's native Audio API
            this.audio.volume = Math.max(0, Math.min(1, volume)); // from 0 to 1.0
            this.audio.loop = loop;
            return this;
        }

        audioPlay(){
            if (this.audio) {
                //this.audio.currentTime = 0;
                this.audio.play().catch(error => {
                    console.error("Audio playback error:", error);
                });
            }
            return this;
        }

        audioPause() {
            if (this.audio) {
                this.audio.pause();
            }
            return this;
        }

        audioVolume(){
            this.audio.volume = Math.max(0, Math.min(1, value));
            return this;
        }

        audioStop(){
            if (this.audio){
                this.audio.pause();
                this.audio.currentTime = 0;
            }
            return this;
        }

        videoLoad(videoURL = new X3D.MFString("./video/shark-clip.mp4"), loop=false){
            this.movieTexture = this.scene.createNode("MovieTexture");
            this.movieTexture.url = videoURL;
            this.movieTexture.loop = loop;
            this.appearance.texture = this.movieTexture;
            return this;
        }

        videoPlay(){
            if (this.movieTexture){
                this.movieTexture.startTime = this.browserTime();
            }
            return this;
        }

        browserTime(){
            return this.scene.getBrowser().currentTime;
        }

        addProximitySensor(
            size = new X3D.SFVec3f(5, 5, 5),
            callback = null
        ) {

            this.proximitySensor =
                this.scene.createNode("ProximitySensor");

            this.proximitySensor.size = size;
            this.proximitySensor.enabled = true;

            // Attach sensor to the Transform
            this.transform.children.push(this.proximitySensor);

            // Listen for entering and leaving the region
            this.proximitySensor.addFieldCallback(
                "on",
                "isActive",
                (active) => {

                    if (active) {
                        if (callback) {
                            callback(this, true);
                        }
                    }
                    else {
                        if (callback) {
                            callback(this, false);
                        }
                    }

                }
            );

            return this;
        }

        remove(){
            this.transform.remove();
        }
    }

    
    class uBox extends uPrimitive {
        constructor(scene){
            super(scene, "Box");
        }
    }

    class uSphere extends uPrimitive {
        constructor(scene){
            super(scene, "Sphere");
        }
    }

    class uCylinder extends uPrimitive {
        constructor(scene){
            super(scene, "Cylinder");
        }
    }

    class uCone extends uPrimitive {
        constructor(scene){
            super(scene, "Cone");
        }
    }



    window.addEventListener("load", async () => {


        const browser = X3D.getBrowser("#browser");
        const scene = await browser.createScene();

        // 2. Instantiate all required nodes
        // const transform   = scene.createNode("Transform");
        uX = new uXite(browser, scene);
        box = uX.addBox();
        box.color(new X3D.SFColor(0,0,1));
        box.image();
        box.audioLoad();
        box.videoLoad();

        // activating touch sensor
        box.addTouchSensor(function(box){
            console.log("touched");
        })

        box.addTouchSensor(box => {
            console.log("t2");
            box.audioPlay();
            box.videoPlay();
        });


        box.addProximitySensor(new X3D.SFVec3f(5,5,5), 
            (box, active) => {
                if (active) {
                    box.audioPlay();
                    box.videoPlay();
                } 
                else {
                    box.audioPause();
                }
            }
        )

        linkBox = uX.addBox();
        linkBox.color(new X3D.SFColor(0,1,0));
        linkBox.pos(new X3D.SFVec3f(3,0,0));
        linkBox.size(new X3D.SFVec3f(1,1,3));
        linkBox.addLink("https://soriki.com");
        
        
        await browser.replaceWorld(scene);
    });
    


</script>

</body>
</html>
